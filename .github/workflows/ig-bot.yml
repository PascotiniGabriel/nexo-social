name: Atendente IA do Instagram
# Responde comentários e directs do @nexoimob.ia. BOT_MODE (Settings > Variables) = ensaio (padrão, só grava rascunhos) ou ativo.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ig-bot
  cancel-in-progress: false
jobs:
  atender:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Atender comentários e directs
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          BOT_MODE: ${{ vars.BOT_MODE || 'ensaio' }}
        run: node scripts/ig-bot/bot.mjs
      - name: Salvar estado (só IDs)
        run: |
          if [ -n "$(git status --porcelain ig-bot-state.json)" ]; then
            git config user.name "nexo-ig-bot"
            git config user.email "actions@users.noreply.github.com"
            git add ig-bot-state.json
            git commit -m "ig-bot: atualiza estado"
            git pull --rebase
            git push
          fi
