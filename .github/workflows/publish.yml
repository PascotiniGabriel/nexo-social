name: Publicar no Instagram
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Simulação (não publica)"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: publicar
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Esperar o horário do próximo post (cron do GitHub atrasa)
        if: ${{ !inputs.dry_run }}
        run: |
          node -e '
            const q=JSON.parse(require("fs").readFileSync("queue.json","utf8"));
            const t=q.filter(i=>i.status==="pendente").map(i=>new Date(i.publish_at).getTime()).sort((a,b)=>a-b)[0];
            const w=t?Math.min(Math.max(0,t-Date.now()),5.5*3600e3):0;
            console.log("esperando",Math.round(w/60000),"min");
            setTimeout(()=>{},w);'
      - name: Publicar itens vencidos
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: node scripts/publish.mjs
      - name: Salvar a fila atualizada
        run: |
          if [ -n "$(git status --porcelain queue.json)" ]; then
            git config user.name "nexo-publisher"
            git config user.email "actions@users.noreply.github.com"
            git add queue.json
            git commit -m "fila: atualiza status das publicacoes"
            git pull --rebase
            git push
          fi
      - name: Agendar a próxima rodada (corrente)
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if grep -q '"pendente"' queue.json; then gh workflow run publish.yml -R ${{ github.repository }}; fi
