name: Apagar post (só para o dono)
on:
  workflow_dispatch:
    inputs:
      media_id:
        description: "ID do post"
        required: true
permissions:
  contents: read
jobs:
  apagar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          MEDIA_ID: ${{ inputs.media_id }}
        run: node scripts/ops/apagar-post.mjs
